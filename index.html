<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paylalo Tutorials</title>
<meta name="description" content="Short how-to videos for every Paylalo feature: Face Scan, requests, payslips, payroll and more." />
<style>
  :root {
    --bg: #f7f8fc; --surface: #ffffff; --surface-2: #eef1f8; --ink: #0f1222; --ink-2: #4b5168; --ink-3: #8a90a6;
    --line: #e3e7f0; --brand: #050170; --brand-2: #147bea; --accent: #147bea; --ok: #12a150;
    --chip: #e8eefc; --chip-ink: #1b2a7a; --shadow: 0 1px 2px rgba(15,18,34,.06), 0 6px 20px rgba(15,18,34,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0f1a; --surface: #151829; --surface-2: #1d2136; --ink: #eef0f8; --ink-2: #b4b9cf; --ink-3: #7d839c;
      --line: #262b44; --brand: #6f8dff; --brand-2: #5aa8ff; --accent: #5aa8ff; --ok: #3ccf7f;
      --chip: #22294a; --chip-ink: #c6d2ff; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0f1a; --surface: #151829; --surface-2: #1d2136; --ink: #eef0f8; --ink-2: #b4b9cf; --ink-3: #7d839c;
    --line: #262b44; --brand: #6f8dff; --brand-2: #5aa8ff; --accent: #5aa8ff; --ok: #3ccf7f;
    --chip: #22294a; --chip-ink: #c6d2ff; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 20; height: 60px; display: flex; align-items: center; gap: 12px;
         padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; }
  .iconbtn:hover { background: var(--surface-2); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.01em; white-space: nowrap; }
  .logo .mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #050170, #147bea); display: grid; place-items: center; color: #fff; }
  .logo small { font-weight: 600; color: var(--ink-3); font-size: 13px; }
  .search { flex: 1; max-width: 560px; margin: 0 auto; display: flex; }
  .search input { flex: 1; min-width: 0; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-right: 0; border-radius: 20px 0 0 20px;
                  background: var(--bg); color: var(--ink); font: inherit; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search button { width: 56px; height: 40px; border: 1px solid var(--line); border-radius: 0 20px 20px 0; background: var(--surface-2); cursor: pointer; display: grid; place-items: center; }

  /* Layout */
  .shell { display: flex; }
  .side { position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; width: 232px; flex: none; padding: 12px; border-right: 1px solid var(--line); background: var(--surface); }
  .side a { display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-radius: 10px; color: var(--ink-2); font-weight: 600; }
  .side a:hover { background: var(--surface-2); }
  .side a.on { background: var(--chip); color: var(--chip-ink); }
  .side h4 { margin: 18px 12px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
  .side .prog { margin: 14px 12px 0; padding: 12px; border-radius: 12px; background: var(--surface-2); font-size: 13px; color: var(--ink-2); }
  .bar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand-2)); }
  main { flex: 1; min-width: 0; padding: 24px 28px 60px; }
  body.noside .side { display: none; }

  /* Home */
  .hero { border-radius: 18px; padding: 28px 30px; color: #fff; margin-bottom: 26px;
          background: radial-gradient(600px 300px at 10% 0%, #1a3fb8, transparent 60%), linear-gradient(120deg, #050170, #0a2fa8 60%, #147bea); }
  .hero h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -.02em; }
  .hero p { margin: 0; opacity: .85; max-width: 640px; }
  .hero .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .hero .btn { background: #fff; color: #050170; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 19px; border: 0; cursor: pointer; font-weight: 700; background: var(--surface-2); }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.16); color: #fff; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 18px; }
  .chip { padding: 7px 14px; border-radius: 10px; background: var(--surface-2); font-weight: 600; cursor: pointer; border: 0; color: var(--ink-2); }
  .chip.on { background: var(--ink); color: var(--bg); }
  .shelf-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 6px 0 14px; font-size: 20px; }
  .shelf-title span { font-size: 14px; color: var(--ink-3); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px 18px; margin-bottom: 34px; }
  .card { display: block; }
  .thumb { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; background: var(--surface-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
  .card:hover .thumb img { transform: scale(1.03); }
  .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
  .lessonno { position: absolute; left: 8px; top: 8px; background: rgba(5,1,112,.85); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .done-badge { position: absolute; right: 8px; top: 8px; background: var(--ok); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .watched { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.35); }
  .watched i { display: block; height: 100%; background: #e5252a; }
  .meta { display: flex; gap: 12px; margin-top: 12px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; background: linear-gradient(135deg, #050170, #147bea); }
  .meta h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.3; }
  .meta .sub { color: var(--ink-3); font-size: 13px; }
  .empty { color: var(--ink-3); padding: 40px 0; }

  /* Watch */
  .watch { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; }
  .player { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 16/9; box-shadow: var(--shadow); }
  .player video { width: 100%; height: 100%; display: block; background: #000; }
  .ticks { position: relative; height: 6px; margin: 8px 2px 0; border-radius: 6px; background: var(--line); cursor: pointer; }
  .ticks .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); }
  .ticks .tick { position: absolute; top: -3px; width: 3px; height: 12px; border-radius: 2px; background: var(--ink-3); }
  .vtitle { margin: 14px 0 8px; font-size: 22px; line-height: 1.25; letter-spacing: -.01em; }
  .vbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
  .owner { display: flex; align-items: center; gap: 12px; }
  .owner b { display: block; }
  .owner span { color: var(--ink-3); font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn.done { background: var(--ok); color: #fff; }
  .desc { margin-top: 14px; border-radius: 14px; padding: 16px 18px; background: var(--surface-2); }
  .desc .facts { font-weight: 700; margin-bottom: 8px; }
  .desc .facts span { color: var(--ink-3); font-weight: 600; }
  .ch-title { margin: 18px 0 10px; font-size: 16px; }
  .ch { display: flex; gap: 14px; padding: 10px 12px; border-radius: 12px; cursor: pointer; align-items: flex-start; }
  .ch:hover { background: var(--surface); }
  .ch.on { background: var(--surface); box-shadow: var(--shadow); }
  .ch .ts { flex: none; min-width: 52px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .ch .n { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--chip); color: var(--chip-ink); }
  .ch.on .n { background: var(--brand); color: #fff; }
  .ch b { display: block; }
  .ch p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
  .upnext { display: flex; flex-direction: column; gap: 4px; }
  .upnext-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .upnext-head h3 { margin: 0; font-size: 16px; }
  .course { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
  .course-top { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .course-top b { display: block; }
  .course-top span { color: var(--ink-3); font-size: 13px; }
  .course-list { max-height: 640px; overflow-y: auto; padding: 6px; }
  .row { display: flex; gap: 10px; padding: 6px; border-radius: 10px; align-items: center; }
  .row:hover { background: var(--surface-2); }
  .row.on { background: var(--chip); }
  .row .idx { width: 22px; text-align: center; color: var(--ink-3); font-size: 12px; font-weight: 700; flex: none; }
  .row.on .idx { color: var(--chip-ink); }
  .row .rthumb { position: relative; width: 140px; flex: none; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .row .rthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .row .rthumb .dur { font-size: 11px; right: 4px; bottom: 4px; }
  .row b { display: block; font-size: 14px; line-height: 1.3; }
  .row span { color: var(--ink-3); font-size: 12px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; }
  .switch input { width: 34px; height: 18px; appearance: none; background: var(--line); border-radius: 9px; position: relative; cursor: pointer; margin: 0; }
  .switch input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch input:checked { background: var(--brand); }
  .switch input:checked::after { left: 18px; }
  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
             background: rgba(5,1,40,.78); color: #fff; text-align: center; padding: 20px; }
  .overlay.show { display: flex; }
  .overlay b { font-size: 22px; }
  .countdown { font-size: 14px; opacity: .8; }

  @media (max-width: 1100px) { .watch { grid-template-columns: 1fr; } .course-list { max-height: none; } }
  @media (max-width: 820px) {
    .side { position: fixed; left: 0; top: 60px; z-index: 30; box-shadow: var(--shadow); transform: translateX(-100%); transition: transform .2s; }
    body.sideopen .side { transform: none; }
    body.noside .side { display: block; }
    main { padding: 16px 16px 48px; }
    .logo small { display: none; }
    .row .rthumb { width: 120px; }
    .hero { padding: 22px 20px; }
    .hero h1 { font-size: 24px; }
  }
  .top .searchbtn { display: none; }
  @media (max-width: 520px) { .search { display: none; } .top .searchbtn { display: grid; } }
  #theme { margin-left: auto; }
  .search + .searchbtn + #theme { margin-left: 0; }
  @media (max-width: 520px) { .search + .searchbtn + #theme { margin-left: 0; } .top .searchbtn { margin-left: auto; } }
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="menu" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="logo" href="#/">
    <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>
    Paylalo <small>Tutorials</small>
  </a>
  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" placeholder="Search tutorials, e.g. payslip, overtime, QR" aria-label="Search tutorials" />
    <button type="submit" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </form>
  <button class="iconbtn searchbtn" id="searchBtn" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button class="iconbtn" id="theme" aria-label="Toggle theme">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<div class="shell">
  <nav class="side" id="side">
    <a href="#/" data-nav="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/watch/" data-nav="continue" id="continueLink"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z" fill="currentColor"/></svg>Continue learning</a>
    <h4>By role</h4>
    <a href="#/shelf/employee" data-nav="employee"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Employees</a>
    <a href="#/shelf/manager" data-nav="manager"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c0-3.5 3-5 7-5s7 1.5 7 5M16 14c3 0 6 1.3 6 4.5"/></svg>Managers</a>
    <a href="#/shelf/admin" data-nav="admin"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg>Owners &amp; Admins</a>
    <h4>You</h4>
    <a href="#/shelf/done" data-nav="done"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Completed</a>
    <div class="prog" id="sideProg"></div>
  </nav>
  <main id="main"></main>
</div>

<script src="site/data.js"></script>
<script>
(function () {
  "use strict";
  var V = window.PAYLALO_VIDEOS || [];
  var SHELVES = {
    employee: { name: "For employees", blurb: "Clock in, file requests, check your pay." },
    manager: { name: "For managers", blurb: "Approve requests and keep an eye on the team." },
    admin: { name: "For owners & admins", blurb: "Set up your company and run payroll." }
  };
  var main = document.getElementById("main");

  // ---- Per-viewer storage (best effort; the page works without it) ----
  function load(key, fallback) { try { var v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  var state = { done: load("pl.done", {}), pos: load("pl.pos", {}), last: load("pl.last", null), autoplay: load("pl.autoplay", true) };

  // ---- Theme ----
  var themeSaved = load("pl.theme", null);
  if (themeSaved) document.documentElement.setAttribute("data-theme", themeSaved);
  document.getElementById("theme").onclick = function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    save("pl.theme", next);
  };

  // ---- Helpers ----
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(t) { t = Math.max(0, Math.round(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
  function bySlug(slug) { for (var i = 0; i < V.length; i++) if (V[i].slug === slug) return V[i]; return null; }
  function initials(who) { return who.toLowerCase().indexOf("every") >= 0 ? "EM" : who.split(/[ ,]+/).filter(Boolean).map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase(); }
  function pct(v) { var p = state.pos[v.slug] || 0; return state.done[v.slug] ? 100 : Math.min(100, Math.round((p / v.duration) * 100)); }
  function doneCount() { return V.filter(function (v) { return state.done[v.slug]; }).length; }

  function card(v) {
    var p = pct(v);
    return '<a class="card" href="#/watch/' + v.slug + '">' +
      '<div class="thumb"><img loading="lazy" src="' + v.thumb + '" alt="">' +
      '<span class="lessonno">Lesson ' + v.n + '</span>' +
      (state.done[v.slug] ? '<span class="done-badge">✓ Done</span>' : "") +
      '<span class="dur">' + fmt(v.duration) + '</span>' +
      (p > 0 && !state.done[v.slug] ? '<div class="watched"><i style="width:' + p + '%"></i></div>' : "") +
      '</div><div class="meta"><div class="avatar">' + initials(v.who) + '</div><div>' +
      '<h3>' + esc(v.title) + '</h3><div class="sub">' + esc(v.who) + ' · ' + v.steps + ' steps</div></div></div></a>';
  }

  function sideProgress() {
    var d = doneCount();
    document.getElementById("sideProg").innerHTML = "<b>Your progress</b><br>" + d + " of " + V.length + " lessons done" +
      '<div class="bar"><i style="width:' + Math.round((d / V.length) * 100) + '%"></i></div>';
    var next = state.last && bySlug(state.last) ? state.last : (V.find(function (v) { return !state.done[v.slug]; }) || V[0]).slug;
    document.getElementById("continueLink").setAttribute("href", "#/watch/" + next);
  }

  function setNav(key) {
    document.querySelectorAll(".side a").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-nav") === key); });
  }

  // ---- Views ----
  function renderHome(filter, query) {
    setNav(filter || "home");
    var list = V.slice();
    var heading = "";
    if (query) {
      var q = query.toLowerCase();
      list = V.filter(function (v) {
        var hay = (v.title + " " + v.subtitle + " " + v.who + " " + v.chapters.map(function (c) { return c.title + " " + (c.detail || ""); }).join(" ")).toLowerCase();
        return hay.indexOf(q) >= 0;
      });
      heading = '<h2 class="shelf-title">Results for “' + esc(query) + '” <span>' + list.length + ' video' + (list.length === 1 ? "" : "s") + '</span></h2>';
      main.innerHTML = heading + (list.length ? '<div class="grid">' + list.map(card).join("") + "</div>" : '<p class="empty">No tutorials match. Try “payroll”, “leave” or “face”.</p>');
      return;
    }
    if (filter === "done") {
      list = V.filter(function (v) { return state.done[v.slug]; });
      main.innerHTML = '<h2 class="shelf-title">Completed <span>' + list.length + " of " + V.length + "</span></h2>" +
        (list.length ? '<div class="grid">' + list.map(card).join("") + "</div>" : '<p class="empty">Nothing yet. Finish a video, or tap “Mark as done”.</p>');
      return;
    }
    if (filter && SHELVES[filter]) {
      list = V.filter(function (v) { return v.shelf === filter; });
      main.innerHTML = '<h2 class="shelf-title">' + SHELVES[filter].name + " <span>" + SHELVES[filter].blurb + "</span></h2>" +
        '<div class="grid">' + list.map(card).join("") + "</div>";
      return;
    }
    var d = doneCount();
    var next = V.find(function (v) { return !state.done[v.slug]; }) || V[0];
    var total = V.reduce(function (a, v) { return a + v.duration; }, 0);
    var html = '<section class="hero"><h1>Learn Paylalo, one step at a time</h1>' +
      "<p>" + V.length + " short videos, about " + Math.round(total / 60) + " minutes in all. Every step shows the screen and says what to tap.</p>" +
      '<div class="row"><a class="btn" href="#/watch/' + next.slug + '">▶ ' + (d ? "Continue: " : "Start: ") + esc(next.title) + "</a>" +
      '<span class="btn ghost">' + d + " / " + V.length + " done</span></div></section>";
    html += '<div class="chips">' +
      '<button class="chip on" data-go="#/">All</button>' +
      Object.keys(SHELVES).map(function (k) { return '<button class="chip" data-go="#/shelf/' + k + '">' + (function(t){return t.charAt(0).toUpperCase()+t.slice(1);})(SHELVES[k].name.replace("For ", "")) + "</button>"; }).join("") +
      "</div>";
    Object.keys(SHELVES).forEach(function (k) {
      var items = V.filter(function (v) { return v.shelf === k; });
      if (!items.length) return;
      html += '<h2 class="shelf-title">' + SHELVES[k].name + " <span>" + SHELVES[k].blurb + "</span></h2>" +
        '<div class="grid">' + items.map(card).join("") + "</div>";
    });
    main.innerHTML = html;
    main.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { location.hash = b.getAttribute("data-go"); }; });
  }

  var cleanup = null;
  function renderWatch(slug) {
    var v = bySlug(slug) || V[0];
    setNav("");
    state.last = v.slug; save("pl.last", state.last);
    var idx = V.indexOf(v);
    var prev = V[idx - 1], next = V[idx + 1];
    var steps = v.chapters.filter(function (c, i) { return i > 0 && i < v.chapters.length - 1; });

    main.innerHTML =
      '<div class="watch"><div>' +
        '<div class="player"><video id="vid" controls playsinline preload="metadata" poster="' + v.thumb + '" src="' + v.file + '"></video>' +
          '<div class="overlay" id="ov"></div></div>' +
        '<div class="ticks" id="ticks"><div class="fill" id="fill"></div>' +
          v.chapters.slice(1).map(function (c) { return '<span class="tick" title="' + esc(c.title) + '" style="left:' + (c.t / v.duration * 100) + '%"></span>'; }).join("") +
        "</div>" +
        '<h1 class="vtitle">' + esc(v.title) + "</h1>" +
        '<div class="vbar"><div class="owner"><div class="avatar">' + initials(v.who) + '</div><div><b>Paylalo Tutorials</b><span>For: ' + esc(v.who) + "</span></div></div>" +
          '<div class="actions">' +
            (prev ? '<a class="btn" href="#/watch/' + prev.slug + '">◀ Previous</a>' : "") +
            '<button class="btn ' + (state.done[v.slug] ? "done" : "") + '" id="doneBtn">' + (state.done[v.slug] ? "✓ Done" : "Mark as done") + "</button>" +
            (next ? '<a class="btn primary" href="#/watch/' + next.slug + '">Next lesson ▶</a>' : "") +
          "</div></div>" +
        '<div class="desc"><div class="facts">Lesson ' + v.n + " of " + V.length + " <span>· " + v.steps + " steps · " + fmt(v.duration) + "</span></div>" +
          "<div>" + esc(v.subtitle) + ".</div>" +
          '<h3 class="ch-title">In this video</h3><div id="chapters">' +
          steps.map(function (c, i) {
            return '<div class="ch" data-t="' + c.t + '"><span class="n">' + (i + 1) + '</span><span class="ts">' + fmt(c.t) + "</span><div><b>" + esc(c.title) + "</b>" +
              (c.detail ? "<p>" + esc(c.detail) + "</p>" : "") + "</div></div>";
          }).join("") +
          "</div></div>" +
      "</div>" +
      '<aside><div class="upnext-head"><h3>Course</h3><label class="switch">Autoplay <input type="checkbox" id="auto"' + (state.autoplay ? " checked" : "") + "></label></div>" +
        '<div class="course"><div class="course-top"><b>Paylalo basics</b><span>' + doneCount() + " / " + V.length + " done</span></div>" +
        '<div class="course-list">' +
        V.map(function (o) {
          return '<a class="row' + (o === v ? " on" : "") + '" href="#/watch/' + o.slug + '"><span class="idx">' + (o === v ? "▶" : (state.done[o.slug] ? "✓" : o.n)) + "</span>" +
            '<div class="rthumb"><img loading="lazy" src="' + o.thumb + '" alt=""><span class="dur">' + fmt(o.duration) + "</span></div>" +
            "<div><b>" + esc(o.title) + "</b><span>" + esc(o.who) + "</span></div></a>";
        }).join("") +
        "</div></div></aside></div>";

    var vid = document.getElementById("vid");
    var chEls = Array.prototype.slice.call(document.querySelectorAll(".ch"));
    var fill = document.getElementById("fill");
    var ov = document.getElementById("ov");
    var timer = null;

    var resume = state.pos[v.slug] || 0;
    vid.addEventListener("loadedmetadata", function () { if (resume > 2 && resume < v.duration - 3 && !state.done[v.slug]) vid.currentTime = resume; });
    vid.addEventListener("timeupdate", function () {
      var t = vid.currentTime;
      fill.style.width = (t / (vid.duration || v.duration) * 100) + "%";
      var active = -1;
      steps.forEach(function (c, i) { if (t >= c.t - 0.05) active = i; });
      if (t >= v.chapters[v.chapters.length - 1].t) active = -1;
      chEls.forEach(function (el, i) { el.classList.toggle("on", i === active); });
      if (Math.floor(t) % 3 === 0) { state.pos[v.slug] = t; save("pl.pos", state.pos); }
    });
    vid.addEventListener("ended", function () {
      state.done[v.slug] = true; save("pl.done", state.done); state.pos[v.slug] = 0; save("pl.pos", state.pos);
      sideProgress();
      var b = document.getElementById("doneBtn"); b.textContent = "✓ Done"; b.classList.add("done");
      if (next && state.autoplay) {
        var n = 5;
        ov.innerHTML = '<span class="countdown">Up next</span><b>' + esc(next.title) + '</b><span class="countdown" id="cd">Starting in ' + n + '…</span>' +
          '<div class="actions"><button class="btn" id="cancelNext">Cancel</button><a class="btn primary" href="#/watch/' + next.slug + '">Play now</a></div>';
        ov.classList.add("show");
        timer = setInterval(function () {
          n -= 1;
          var cd = document.getElementById("cd"); if (cd) cd.textContent = "Starting in " + n + "…";
          if (n <= 0) { clearInterval(timer); location.hash = "#/watch/" + next.slug; }
        }, 1000);
        document.getElementById("cancelNext").onclick = function () { clearInterval(timer); ov.classList.remove("show"); };
      } else if (!next) {
        ov.innerHTML = "<b>🎉 You finished the course</b><span class=\"countdown\">" + doneCount() + " of " + V.length + ' lessons done</span><div class="actions"><a class="btn primary" href="#/">Back to all tutorials</a></div>';
        ov.classList.add("show");
      }
    });
    chEls.forEach(function (el) { el.onclick = function () { vid.currentTime = parseFloat(el.getAttribute("data-t")) + 0.05; vid.play(); }; });
    document.getElementById("ticks").onclick = function (e) {
      var r = this.getBoundingClientRect();
      vid.currentTime = ((e.clientX - r.left) / r.width) * (vid.duration || v.duration);
    };
    document.getElementById("doneBtn").onclick = function () {
      state.done[v.slug] = !state.done[v.slug]; save("pl.done", state.done);
      this.textContent = state.done[v.slug] ? "✓ Done" : "Mark as done";
      this.classList.toggle("done", !!state.done[v.slug]);
      sideProgress();
    };
    document.getElementById("auto").onchange = function () { state.autoplay = this.checked; save("pl.autoplay", state.autoplay); };
    var p = vid.play(); if (p && p.catch) p.catch(function () {});
    window.scrollTo(0, 0);
    cleanup = function () { if (timer) clearInterval(timer); vid.pause(); };
  }

  // ---- Router ----
  function route() {
    if (cleanup) { cleanup(); cleanup = null; }
    document.body.classList.remove("sideopen");
    var h = location.hash.replace(/^#\/?/, "");
    var parts = h.split("/");
    if (parts[0] === "watch") renderWatch(parts[1] || state.last || V[0].slug);
    else if (parts[0] === "shelf") renderHome(parts[1]);
    else if (parts[0] === "search") renderHome(null, decodeURIComponent(parts.slice(1).join("/")));
    else renderHome();
    sideProgress();
  }
  window.addEventListener("hashchange", route);

  document.getElementById("searchForm").onsubmit = function (e) {
    e.preventDefault();
    var q = document.getElementById("q").value.trim();
    location.hash = q ? "#/search/" + encodeURIComponent(q) : "#/";
  };
  document.getElementById("searchBtn").onclick = function () {
    var q = window.prompt("Search tutorials");
    if (q) location.hash = "#/search/" + encodeURIComponent(q.trim());
  };
  document.getElementById("menu").onclick = function () {
    if (window.matchMedia("(max-width: 820px)").matches) document.body.classList.toggle("sideopen");
    else document.body.classList.toggle("noside");
  };

  route();
})();
</script>
</body>
</html>
